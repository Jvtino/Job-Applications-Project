<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Create your account</title></head>
  <body>
    <h1>Create your account to apply</h1>
    <form id="signup" action="/account" method="post">
      <div><label for="email">Email</label><input id="email" type="email" name="email" /></div>
      <div><label for="first">First name</label><input id="first" type="text" name="first_name" /></div>
      <div><label for="last">Last name</label><input id="last" type="text" name="last_name" /></div>
      <div><label for="phone">Phone</label><input id="phone" type="tel" name="phone" /></div>
      <div><label for="pw">Password</label><input id="pw" type="password" name="password" /></div>
      <div><label for="pw2">Confirm password</label><input id="pw2" type="password" name="confirm_password" /></div>
      <button type="submit" id="create">Create account</button>
    </form>
    <script>
      // Guard: prove the app never submits the account-creation form.
      window.__accountSubmitted = false;
      document.getElementById("signup").addEventListener("submit", function (e) {
        e.preventDefault();
        window.__accountSubmitted = true;
      });
    </script>
  </body>
</html>
