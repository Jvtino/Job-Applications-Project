<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Apply — Operations Analyst</title></head>
  <body>
    <header>
      <nav>Already have an account? <a href="/login" id="signin">Sign in</a></nav>
    </header>
    <main>
      <h1>Apply for Operations Analyst</h1>
      <form id="application" action="/apply/submit" method="post">
        <div><label for="first">First name</label><input id="first" type="text" name="first_name" /></div>
        <div><label for="last">Last name</label><input id="last" type="text" name="last_name" /></div>
        <div><label for="email">Email</label><input id="email" type="email" name="email" /></div>
        <div><label for="phone">Phone</label><input id="phone" type="tel" name="phone" /></div>
        <div><label for="resume">Resume / CV</label><input id="resume" type="file" name="resume" /></div>
        <div><label for="why">Why do you want to work here?</label><textarea id="why" name="why"></textarea></div>
        <button type="submit" id="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
