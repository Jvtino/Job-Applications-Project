<!doctype html>
<html lang="en" data-ats="greenhouse">
  <head>
    <meta charset="utf-8" />
    <title>Operations Analyst - Acme Corp</title>
    <style>
      .field { margin: 12px 0; }
      .menu[hidden] { display: none; }
      .menu { border: 1px solid #ccc; list-style: none; padding: 0; margin: 2px 0; }
      .menu li { padding: 4px 8px; cursor: pointer; }
      [role="combobox"] { border: 1px solid #999; padding: 6px; min-height: 18px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Operations Analyst</h1>
    <form id="application-form" action="https://boards.greenhouse.io/acme/jobs/123" method="post">
      <div class="field required">
        <label for="first_name">First Name *</label>
        <input id="first_name" name="first_name" type="text" required />
      </div>
      <div class="field required">
        <label for="last_name">Last Name *</label>
        <input id="last_name" name="last_name" type="text" required />
      </div>
      <div class="field required">
        <label for="email">Email *</label>
        <input id="email" name="email" type="email" required />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" />
      </div>
      <div class="field">
        <label for="linkedin">LinkedIn Profile</label>
        <input id="linkedin" name="linkedin" type="url" />
      </div>
      <div class="field required">
        <label for="resume">Resume/CV *</label>
        <input id="resume" name="resume" type="file" required />
      </div>

      <div class="field required">
        <label for="work_auth">Are you legally authorized to work in the United States? *</label>
        <select id="work_auth" name="work_auth" required>
          <option value="">Select...</option>
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>

      <fieldset class="field required">
        <legend>Will you now or in the future require sponsorship for employment visa status? *</legend>
        <label><input type="radio" name="sponsorship" value="yes" /> Yes</label>
        <label><input type="radio" name="sponsorship" value="no" /> No</label>
      </fieldset>

      <div class="field required">
        <label for="age18">Are you at least 18 years of age? *</label>
        <select id="age18" name="age18" required>
          <option value="">Select...</option>
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>

      <div class="field">
        <label for="prior">Have you previously worked for Acme Corp?</label>
        <select id="prior" name="prior">
          <option value="">Select...</option>
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>

      <!-- EEO self-identification (voluntary) -->
      <div class="field">
        <label id="gender-label">Gender</label>
        <div id="gender" role="combobox" aria-labelledby="gender-label" aria-controls="gender-menu" tabindex="0">
          <span class="value"></span>
        </div>
        <ul id="gender-menu" class="menu" role="listbox" hidden>
          <li role="option">Male</li>
          <li role="option">Female</li>
          <li role="option">Non-binary</li>
          <li role="option">Decline to self-identify</li>
        </ul>
      </div>
      <div class="field">
        <label for="race">Race / Ethnicity</label>
        <select id="race" name="race">
          <option value="">Select...</option>
          <option>Hispanic or Latino</option>
          <option>White</option>
          <option>Black or African American</option>
          <option>Asian</option>
          <option>Two or More Races</option>
          <option>Decline to self-identify</option>
        </select>
      </div>
      <div class="field">
        <label for="disability">Disability Status</label>
        <select id="disability" name="disability">
          <option value="">Select...</option>
          <option>Yes, I have a disability, or have had one in the past</option>
          <option>No, I do not have a disability and have not had one in the past</option>
          <option>I do not wish to answer</option>
        </select>
      </div>

      <div class="field required">
        <label for="why">Why do you want to work at Acme Corp? *</label>
        <textarea id="why" name="why" required></textarea>
      </div>
      <div class="field">
        <label for="source">How did you hear about us?</label>
        <input id="source" name="source" type="text" />
      </div>

      <button type="submit" id="submit_app">Submit Application</button>
    </form>

    <script>
      // Submit guard: prove ApplyPilot never submits in semi_auto.
      window.__submitted = false;
      document
        .getElementById("application-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          window.__submitted = true;
        });
      // Minimal custom-dropdown behavior for the Gender combobox.
      (function () {
        var combo = document.getElementById("gender");
        var menu = document.getElementById("gender-menu");
        combo.addEventListener("click", function () {
          menu.hidden = !menu.hidden;
        });
        menu.querySelectorAll('[role="option"]').forEach(function (o) {
          o.addEventListener("click", function () {
            combo.querySelector(".value").textContent = o.textContent;
            menu.hidden = true;
          });
        });
      })();
    </script>
  </body>
</html>
